
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Bubbuuu 💗</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Poppins", Arial, sans-serif;
            background: linear-gradient(135deg, #ffe4ec, #fce7ff, #fff0f5);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #7b3455;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 35px 25px;
            border-radius: 25px;
            width: 90%;
            max-width: 430px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(200, 100, 150, 0.2);
            position: relative;
            z-index: 2;
        }

        h1 {
            color: #e75480;
            font-size: 28px;
            margin-bottom: 15px;
        }

        h2 {
            color: #e75480;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
        }

        .clue {
            background: #fff0f5;
            padding: 12px;
            border-radius: 15px;
            font-size: 15px;
            margin: 20px 0;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 2px solid #ffc1d5;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #e75480;
        }

        button {
            background: #e75480;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #d94370;
            transform: scale(1.04);
        }

        #error-message {
            color: #d94370;
            font-size: 15px;
            margin-top: 15px;
        }

        .love-note {
            font-size: 24px;
            color: #e75480;
            font-weight: bold;
            margin-top: 20px;
        }

        .heart {
            position: fixed;
            bottom: -30px;
            color: #ff8fab;
            font-size: 22px;
            animation: floatUp 7s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        #birthday-page {
            display: none;
        }
    </style>
</head>

<body>

<!-- PASSWORD SCREEN -->
<div class="card" id="password-screen">

    <h1>Only for my Bubbuuu 💗</h1>

    <p>Before you enter, answer this little question...</p>

    <div class="clue">
        💌 Clue: The cute name which you gave me recently.
    </div>

    <input
            type="password"
            id="password"
            placeholder="Enter our secret password"
    >

    <button onclick="checkPassword()">Unlock 💕</button>

    <p id="error-message"></p>

</div>


<!-- BIRTHDAY PAGE -->
<div class="card" id="birthday-page">

    <h1>Happy Birthday, My Bubbuuu! 🎂💗</h1>

    <p>
        11 days to go, my bubbuuu 💗
    </p>

    <p id="age"></p>

    <div class="love-note">
        Pri loves you! 💕
    </div>

    <p>
        You are my favorite person, my happiness,
        and my sweetest little love. 💖
    </p>

</div>


<script>

    // PASSWORD CHECK
    function checkPassword() {

        const enteredPassword =
            document.getElementById("password").value;


        if (enteredPassword.toLowerCase() === "handu") {

            document.getElementById("password-screen").style.display = "none";

            document.getElementById("birthday-page").style.display = "block";

            calculateAge();

        } else {

            document.getElementById("error-message").innerText =
                "Think from your heart and enter the password 💕";

            document.getElementById("password").value = "";

        }
    }


    // ALLOW ENTER KEY
    document.getElementById("password").addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            checkPassword();
        }

    });


    // CALCULATE AGE IN YEARS AND DAYS
    function calculateAge() {

        const birthDate = new Date(1997, 10, 15);
        const today = new Date();

        let years = today.getFullYear() - birthDate.getFullYear();

        let lastBirthday = new Date(
            today.getFullYear(),
            birthDate.getMonth(),
            birthDate.getDate()
        );

        if (today < lastBirthday) {
            years--;
            lastBirthday.setFullYear(lastBirthday.getFullYear() - 1);
        }

        const difference = today - lastBirthday;

        const days = Math.floor(
            difference / (1000 * 60 * 60 * 24)
        );

        document.getElementById("age").innerText =
            "You are " + years + " years and " + days +
            " days old, my love 💗";

    }


    // FLOATING HEARTS
    function createHeart() {

        const heart = document.createElement("div");

        heart.classList.add("heart");
        heart.innerHTML = "💗";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration =
            (Math.random() * 3 + 5) + "s";

        heart.style.fontSize =
            (Math.random() * 15 + 15) + "px";

        document.body.appendChild(heart);

        setTimeout(function() {
            heart.remove();
        }, 8000);

    }

    setInterval(createHeart, 500);

</script>

</body>
</html>
